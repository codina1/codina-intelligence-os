openapi: 3.1.0
info:
  title: CODINA Intelligence OS API
  version: 1.2.0
  description: |
    Phase 01 + Phase 02A + Phase 02B (mock sync engine) implemented endpoints.
    Authentication uses first-party session cookies after POST /api/v1/auth/login.
    SPA clients must call GET /api/v1/auth/csrf-cookie then send X-XSRF-TOKEN on mutating requests.
    No live OAuth, credential exchange, or external HTTP. Sync results are always simulated.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Tenants
  - name: Sites
  - name: MockConnectors
  - name: ConnectorProviders
  - name: DataSources
  - name: SyncRuns
paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Application health
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Degraded
  /api/v1/auth/csrf-cookie:
    get:
      tags: [Auth]
      summary: Issue CSRF/session cookies for SPA clients
      operationId: csrfCookie
      responses:
        '200':
          description: CSRF cookie issued
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Create session
      operationId: login
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                remember: { type: boolean }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Destroy session
      operationId: logout
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: Logged out
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      operationId: me
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: Current user
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/tenants:
    get:
      tags: [Tenants]
      summary: List authorized tenants
      operationId: listTenants
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: Tenant list
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Tenants]
      summary: Create tenant (platform admin)
      operationId: createTenant
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string }
                status: { type: string, enum: [active, suspended] }
                settings: { type: object }
      responses:
        '201':
          description: Created
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tenants/{id}:
    get:
      tags: [Tenants]
      summary: Show tenant
      operationId: showTenant
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Tenant
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/sites:
    get:
      tags: [Sites]
      summary: List sites for authorized tenants
      operationId: listSites
      security: [{ sessionAuth: [] }]
      parameters:
        - name: tenant_id
          in: query
          schema: { type: integer }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated sites
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Sites]
      summary: Create site
      operationId: createSite
      security: [{ sessionAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, name, primary_url]
              properties:
                tenant_id: { type: integer }
                name: { type: string }
                slug: { type: string }
                primary_url: { type: string, format: uri }
                status: { type: string, enum: [active, inactive] }
                settings: { type: object }
      responses:
        '201':
          description: Created
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/sites/{id}:
    get:
      tags: [Sites]
      summary: Show site
      operationId: showSite
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Site
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Sites]
      summary: Update site
      operationId: updateSite
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Updated
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Sites]
      summary: Delete site
      operationId: deleteSite
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/mock-connectors:
    get:
      tags: [MockConnectors]
      summary: List mock connectors
      operationId: listMockConnectors
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: Connector summaries
  /api/v1/mock-connectors/{key}:
    get:
      tags: [MockConnectors]
      summary: Fetch mock connector fixture data or simulated error
      operationId: showMockConnector
      security: [{ sessionAuth: [] }]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum:
              - wordpress
              - woocommerce
              - google_search_console
              - google_analytics_4
              - tutor_lms_pro
        - name: scenario
          in: query
          schema:
            type: string
            enum:
              - success
              - empty
              - pagination
              - invalid_payload
              - rate_limit
              - unauthorized
              - temporary_failure
              - repeated_sync
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Fixture data
        '401':
          description: Unauthenticated or simulated unauthorized
        '429':
          description: Simulated rate limit
  /api/v1/connector-providers:
    get:
      tags: [ConnectorProviders]
      summary: List mock connector provider metadata
      operationId: listConnectorProviders
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: Provider catalog (mock-only)
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/connector-providers/{key}:
    get:
      tags: [ConnectorProviders]
      summary: Show one provider definition
      operationId: getConnectorProvider
      security: [{ sessionAuth: [] }]
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum: [wordpress, woocommerce, google_search_console, google_analytics_4, tutor_lms_pro]
      responses:
        '200':
          description: Provider definition
        '404':
          description: Unknown provider
  /api/v1/data-sources:
    get:
      tags: [DataSources]
      summary: List tenant-authorized data sources
      operationId: listDataSources
      security: [{ sessionAuth: [] }]
      parameters:
        - name: tenant_id
          in: query
          schema: { type: integer }
        - name: site
          in: query
          schema: { type: integer }
        - name: provider
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: mode
          in: query
          schema: { type: string, enum: [mock] }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated data sources
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [DataSources]
      summary: Create a mock data source
      operationId: createDataSource
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, provider, display_name]
              properties:
                tenant_id: { type: integer }
                site_id: { type: integer, nullable: true }
                provider:
                  type: string
                  enum: [wordpress, woocommerce, google_search_console, google_analytics_4, tutor_lms_pro]
                display_name: { type: string }
                mode: { type: string, enum: [mock] }
                auth_method: { type: string }
                settings:
                  type: object
                  additionalProperties: false
                  properties:
                    fixture_dataset: { type: string }
                    pagination_size: { type: integer }
                    simulated_error_scenario: { type: string }
                    reporting_timezone: { type: string }
                    mock_external_resource_id: { type: string }
      responses:
        '201':
          description: Created
        '409':
          description: Duplicate provider/site scope
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/data-sources/{id}:
    get:
      tags: [DataSources]
      summary: Get data source by public UUID
      operationId: getDataSource
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Data source
        '404':
          description: Not found (also used for cross-tenant)
    patch:
      tags: [DataSources]
      summary: Update mock data source configuration or status
      operationId: updateDataSource
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
        '422':
          description: Invalid transition or settings
  /api/v1/data-sources/{id}/test:
    post:
      tags: [DataSources]
      summary: Run mock connection test (fixtures only)
      operationId: testDataSource
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scenario:
                  type: string
                  enum: [success, empty, unauthorized, rate_limit, timeout, invalid_payload, temporary_failure]
      responses:
        '200':
          description: Mock test result (never claims real connectivity)
        '422':
          description: Disabled/draft or invalid state
  /api/v1/data-sources/{id}/health:
    get:
      tags: [DataSources]
      summary: Append-only mock health check history
      operationId: dataSourceHealth
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paginated health history
  /api/v1/data-sources/{id}/capabilities:
    get:
      tags: [DataSources]
      summary: List capabilities for a data source
      operationId: dataSourceCapabilities
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Capability list
  /api/v1/data-sources/{id}/disable:
    post:
      tags: [DataSources]
      summary: Disable a data source
      operationId: disableDataSource
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Disabled
        '422':
          description: Invalid transition
  /api/v1/data-sources/{id}/sync:
    post:
      tags: [SyncRuns]
      summary: Queue a mock sync run (always simulated)
      operationId: startSyncRun
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sync_type, entity_type]
              properties:
                sync_type: { type: string, enum: [full, incremental] }
                entity_type: { type: string }
                scope_key: { type: string, default: default }
      responses:
        '202':
          description: Sync run queued/executed (mock)
        '409':
          description: Active scope conflict
        '422':
          description: Disabled or non-mock source
  /api/v1/data-sources/{id}/checkpoints:
    get:
      tags: [SyncRuns]
      summary: List checkpoints for a mock data source
      operationId: listCheckpoints
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paginated checkpoints (no lease/fencing fields)
  /api/v1/data-sources/{id}/sync-health:
    get:
      tags: [SyncRuns]
      summary: Mock sync health summary for a data source
      operationId: syncHealth
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Simulated sync health
  /api/v1/sync-runs:
    get:
      tags: [SyncRuns]
      summary: List sync runs
      operationId: listSyncRuns
      security: [{ sessionAuth: [] }]
      responses:
        '200':
          description: Paginated sync runs
  /api/v1/sync-runs/{id}:
    get:
      tags: [SyncRuns]
      summary: Show a sync run
      operationId: showSyncRun
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sync run (simulated)
        '404':
          description: Not found (also used for cross-tenant)
  /api/v1/sync-runs/{id}/attempts:
    get:
      tags: [SyncRuns]
      summary: List attempts for a sync run
      operationId: listSyncAttempts
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paginated attempts
  /api/v1/sync-runs/{id}/retry:
    post:
      tags: [SyncRuns]
      summary: Retry a failed or partial mock sync run
      operationId: retrySyncRun
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Retry queued/executed
        '422':
          description: Terminal or ineligible run
  /api/v1/sync-runs/{id}/cancel:
    post:
      tags: [SyncRuns]
      summary: Request cancellation of a sync run
      operationId: cancelSyncRun
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cancellation acknowledged
        '422':
          description: Already terminal
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: laravel_session
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: SPA CSRF header (alternatives X-CSRF-TOKEN or body _token)
      schema: { type: string }
  responses:
    CsrfMismatch:
      description: CSRF token missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Meta:
      type: object
      required: [request_id, schema_version]
      properties:
        request_id: { type: string }
        schema_version: { type: string, example: '1.0' }
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            service: { type: string }
            phase: { type: string }
            status: { type: string }
            checks: { type: object }
        meta:
          $ref: '#/components/schemas/Meta'
    UserEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
            is_platform_admin: { type: boolean }
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
        meta:
          $ref: '#/components/schemas/Meta'
